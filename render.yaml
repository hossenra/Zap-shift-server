# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploys are triggered by the GitHub Actions pipeline (after tests pass),
# so Render's own auto-deploy is turned off.
services:
  - type: web
    name: zap-shift-server
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: PAYMENT_GATEWAY_KEY
        sync: false
      - key: FIREBASE_SERVICE_KEY
        sync: false
      - key: CLIENT_URL
        sync: false
