name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical
        continue-on-error: true

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t zap-shift-server:${{ github.sha }} .

      - name: Run container and hit /health
        run: |
          docker run -d --name api -p 4000:4000 zap-shift-server:${{ github.sha }}
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:4000/health; then
              echo; echo "Container is healthy"; exit 0
            fi
            sleep 2
          done
          echo "Container did not become healthy"
          docker logs api
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f api || true

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      API_URL: ${{ vars.API_URL }}
    steps:
      - name: Trigger Render deploy
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL secret is not set - skipping deploy."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Deploy triggered on Render"

      - name: Wait for the new version to be healthy
        if: env.API_URL != '' && env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          # Render's free tier can take a few minutes to build and wake up
          sleep 60
          for i in $(seq 1 30); do
            if curl -fsS "$API_URL/health"; then
              echo; echo "Production is healthy"; exit 0
            fi
            sleep 10
          done
          echo "::error::Production health check failed"
          exit 1
