# One-off helper: regenerates package-lock.json and commits it back.
# Removed again in the next commit.
name: Regenerate lockfile

on:
  push:
    branches: [interview-ready]
    paths: [.github/workflows/regenerate-lockfile.yml]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: interview-ready

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate lockfile and update nodemon
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --no-audit --no-fund
          npm install --save-dev nodemon@^3 --package-lock-only --no-audit --no-fund
          npm ci --no-audit --no-fund

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Regenerate package-lock.json and update nodemon to v3"
          git push origin HEAD:interview-ready
